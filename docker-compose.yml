version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: open-agent-phone-server
    ports:
      - "8001:8001"
    volumes:
      - ./server/open_agent_phone.db:/app/open_agent_phone.db
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: open-agent-phone-client
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001
    depends_on:
      - server
    restart: unless-stopped
